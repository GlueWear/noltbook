<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GRIMOIRE</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
*{scrollbar-width:thin;scrollbar-color:#333 transparent}
*::-webkit-scrollbar{width:4px;height:4px}
*::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
:root{
  --urbit:#ffaa00;--visitor:#569CD6;--bot:#6A9955;
  --bg:#181818;--bg2:#2a2a2a;--bg3:#242424;
  --border:#222;--border2:#2a2a2a;
  --text:#ddd;--text-dim:#666;--text-muted:#888;
  --font:'IBM Plex Mono',monospace;
}
html,body{height:100%;font-family:var(--font);font-size:14px;background:var(--bg);color:var(--text);overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh}
.app-header{display:flex;align-items:center;justify-content:space-between;padding:0 1rem 0 1rem;height:42px;border-bottom:1px solid var(--border);flex-shrink:0}
.logo{font-size:1.5rem;letter-spacing:.3em;color:#ffaa00;margin-left:.3em;cursor:pointer;padding:.2rem .4rem}
.logo:hover{background:var(--bg2)}
.user-info{display:flex;align-items:center;gap:.75rem;margin-right:48px}
.ship-name{font-size:1.5rem;cursor:pointer;padding:.2rem .4rem}
.ship-name:hover{background:var(--bg2)}
.header-dial{display:flex;align-items:center;gap:.3rem;margin:0 auto}
.header-dial .dial-label{font-size:.65rem;color:var(--text-dim);letter-spacing:.1em}
.app-body{display:flex;flex:1;overflow:hidden}
.sidebar{width:220px;min-width:150px;max-width:500px;background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;position:relative}
.sidebar-resize{position:absolute;top:0;right:0;width:4px;height:100%;cursor:col-resize;z-index:10}
.sidebar-resize:hover{background:rgba(255,170,0,.3)}
.sidebar-top{padding:0 .75rem;height:42px;display:flex;align-items:center;gap:.5rem;border-bottom:1px solid var(--border);flex-shrink:0}
.view-toggle{display:flex;height:1.7rem;flex-shrink:0}
.view-toggle-opt{font-family:var(--font);font-size:.7rem;padding:0 .5rem;background:transparent;border:1px solid #444;color:#888;cursor:pointer;letter-spacing:.05em;display:flex;align-items:center}
.view-toggle-opt+.view-toggle-opt{margin-left:-1px}
.view-toggle-opt.active{border-color:#ffaa00;color:#ffaa00;z-index:1}
.new-btn{font-family:var(--font);font-size:.8rem;padding:.25rem .5rem;background:transparent;border:1px solid #ffaa00;color:#ffaa00;cursor:pointer;margin-left:auto}
.new-btn:hover{background:rgba(255,170,0,.15)}
.pals-btn{font-family:var(--font);font-size:.8rem;padding:.25rem .5rem;background:transparent;border:1px solid #4aba8a;color:#4aba8a;cursor:pointer;margin-left:auto}
.pals-btn:hover{background:rgba(74,186,138,.15)}
.contact-item{padding:.4rem 1rem;cursor:pointer;display:flex;align-items:flex-start;gap:.5rem;border-bottom:1px solid var(--border)}
.contact-item:hover{background:var(--bg2)}
.contact-avatar{width:3.5rem;height:3.5rem;border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}
.contact-avatar img{width:100%;height:100%;object-fit:cover;border-radius:3px}
.contact-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:.1rem}
.contact-name{font-size:1rem;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.contact-ship{font-size:.85rem;color:#bbb;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.contact-tags{display:flex;gap:.35rem;margin-top:.15rem;align-items:center}
.contact-tag{font-family:var(--font);font-size:.6rem;padding:.1rem .35rem;border:1px solid #444;color:#888;cursor:pointer;user-select:none;letter-spacing:.05em;text-align:center}
.contact-tag.pal-slot{min-width:5.5rem}
.contact-tag.block-slot{min-width:4.5rem;margin-left:auto}
.contact-tag:hover{border-color:#666}
.contact-tag.blocked{border-color:#ff4444;color:#ff4444;background:rgba(255,68,68,.1)}
.contact-tag.mutual{border-color:#2D6752;color:#4aba8a;background:rgba(45,103,82,.15)}
.contact-tag.requesting{border-color:#ffaa00;color:#ffaa00;background:rgba(255,170,0,.1)}
.contact-tag.requested{border-color:#3b82f6;color:#3b82f6;background:rgba(59,130,246,.1)}
.sidebar-scroll{flex:1;overflow-y:auto;overflow-x:hidden}
.section-header{display:flex;align-items:center;gap:.4rem;padding:.4rem .75rem;cursor:pointer;border-bottom:1px solid var(--border);user-select:none}
.section-header:hover{background:var(--bg2)}
.section-arrow{font-size:.6rem;color:var(--text-dim);transition:transform .15s}
.section-arrow.open{transform:rotate(90deg)}
.section-title{font-size:.8rem;color:var(--text-dim);letter-spacing:.1em}
.section-body{display:none}
.section-body.open{display:block}
.note-item{padding:.4rem 1rem;cursor:pointer;display:flex;align-items:flex-start;gap:.3rem;position:relative;border-bottom:1px solid var(--border)}
.note-item:hover{background:var(--bg2)}
.note-item.active{background:var(--bg2);border-left:2px solid #ffaa00}
.note-item.depth-1{padding-left:2rem}
.note-item.depth-2{padding-left:3rem}
.note-item.depth-3{padding-left:4rem}
.note-item.depth-4{padding-left:5rem}
.note-item.depth-5{padding-left:6rem}
.note-icon{width:3.5rem;height:3.5rem;border-radius:3px;flex-shrink:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;align-items:center;justify-items:center;font-size:.75rem;background:#000;color:#bbb;line-height:1}
.note-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:.1rem}
.note-name{font-size:1rem;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-item.active .note-name{color:#ffaa00}
.note-source{font-size:.85rem;color:#bbb;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-preview{font-size:.8rem;color:#bbb;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-dot{width:5px;height:5px;border-radius:50%;background:var(--bot);flex-shrink:0;display:none}
.note-item.has-notif .note-dot{display:block}
.note-arrow{font-size:.55rem;color:var(--text-dim);width:.8rem;flex-shrink:0;cursor:pointer;transition:transform .15s}
.note-arrow.open{transform:rotate(90deg)}
.note-arrow:hover{color:var(--text-muted)}
.chat{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.chat-header{display:flex;align-items:center;justify-content:space-between;padding:0 1rem;height:42px;border-bottom:1px solid var(--border);flex-shrink:0}
.chat-note-name{font-size:1.1rem;color:#ffaa00;cursor:pointer;text-decoration:underline;padding:.2rem .4rem}
.chat-note-name:hover{background:var(--bg2)}
.share-btn{font-family:var(--font);font-size:.8rem;padding:.25rem .5rem;background:transparent;border:1px solid #ffaa00;color:#ffaa00;cursor:pointer;display:none}
.share-btn:hover{background:rgba(255,170,0,.15)}
.dial-wrap{display:none;align-items:center;gap:.3rem;margin-left:auto;margin-right:.5rem}
.dial-label{font-size:.65rem;color:var(--text-dim);letter-spacing:.1em}
.dial-box{font-family:var(--font);font-size:.7rem;width:1.5rem;height:1.5rem;display:flex;align-items:center;justify-content:center;border:1px solid #444;color:#888;cursor:pointer;background:transparent}
.dial-box:hover{border-color:#666}
.dial-box.active{border-color:#ffaa00;color:#ffaa00}
.chat-messages{flex:1;overflow-y:auto;padding:.5rem 0}
.msg{display:flex;align-items:flex-start;gap:.6rem;padding:0 1rem;margin-top:.6rem;position:relative}
.msg:first-child{padding-top:.25rem}
.msg.grouped{padding:0 1rem;margin-top:0}
.msg-avatar{width:2.8rem;height:2.8rem;border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.8rem;background:#000;color:var(--text-dim);overflow:hidden}
.msg-avatar svg{width:100%;height:100%}
.msg.grouped .msg-avatar{display:none}
.msg-body{flex:1;min-width:0}
.msg-header{display:flex;align-items:baseline;gap:.6rem;margin-bottom:0}
.msg.grouped .msg-header{display:none}
.msg-author{font-size:1rem;font-weight:500}
.msg-author.urbit{color:#ddd}
.msg-author.visitor{color:var(--visitor)}
.msg-time{font-size:.75rem;color:var(--text-dim)}
.msg-text{font-family:var(--font);font-size:1rem;line-height:1.5;color:#ddd;word-break:break-word;white-space:pre-wrap}
.msg:hover{background:rgba(255,255,255,.04)}
.msg.selected{background:rgba(255,255,255,.06)}
.msg-actions{display:none;flex-direction:column;gap:.25rem;position:absolute;right:1rem;top:1.5rem;background:var(--bg2);padding:.25rem;border:1px solid var(--border);border-radius:3px;z-index:10;min-width:5rem}
.msg.show-actions .msg-actions{display:flex}
.msg-action-btn{font-family:var(--font);font-size:.7rem;padding:.15rem .4rem;background:transparent;border:1px solid #333;color:#666;cursor:pointer;transition:all .15s}
.msg-action-btn:hover{border-color:#ffaa00;color:#ffaa00}
.msg-action-btn.send-msg:hover{border-color:#00ff88;color:#00ff88}
.msg-action-btn.delete-msg{color:#666;border-color:#333}
.msg-action-btn.delete-msg:hover{border-color:#ff4444;color:#ff4444;background:rgba(255,68,68,.15)}
.msg-edited{font-size:.65rem;color:var(--text-dim);font-style:italic;margin-left:.4rem}
.msg.depth-1{margin-left:1.5rem}
.msg.depth-2{margin-left:3rem}
.msg.depth-3{margin-left:4.5rem}
.msg.depth-4{margin-left:6rem}
.msg.depth-5{margin-left:7.5rem}
.msg-thread{margin-left:0;padding-left:0}
.msg-thread-more{font-family:var(--font);font-size:.7rem;color:var(--text-dim);background:none;border:none;cursor:pointer;padding:.2rem 1rem;display:block}
.msg-thread-more:hover{color:#ffaa00}
.reply-bar{background:transparent;padding:.25rem .75rem;margin:0 0 .4rem 0;font-size:.8rem;color:var(--text-dim);display:none}
.reply-bar.visible{display:flex;align-items:center;gap:.35rem}
.reply-label{background:rgba(255,255,255,.06);padding:.2rem .5rem;border-radius:2px;font-size:.8rem;color:var(--text-dim)}
.reply-close{background:none;border:1px solid #333;color:var(--text-dim);cursor:pointer;font-family:var(--font);font-size:.7rem;padding:.1rem .25rem;line-height:1;width:1.4rem;height:1.4rem;display:flex;align-items:center;justify-content:center}
.reply-close:hover{border-color:var(--text-dim);color:var(--text)}
.chat-input-area{border-top:1px solid var(--border);padding:1rem 1rem 1.5rem;flex-shrink:0;background:var(--bg)}
.chat-input-row{display:flex;align-items:stretch;gap:.5rem}
.attach-wrap{position:relative;flex-shrink:0;display:flex}
.attach-btn{font-family:var(--font);font-size:1rem;line-height:1;padding:.4rem .55rem;background:transparent;border:1px solid var(--border2);color:var(--text-dim);cursor:pointer;display:block;width:100%}
.attach-btn:hover{border-color:#ffaa00;color:#ffaa00;background:rgba(255,170,0,.1)}
.attach-menu{position:absolute;bottom:calc(100% + 6px);right:0;background:var(--bg2);border:1px solid var(--border);min-width:150px;display:none;z-index:50}
.attach-menu.open{display:block}
.attach-item{display:block;width:100%;font-family:var(--font);font-size:.8rem;padding:.45rem .75rem;background:none;border:none;color:var(--text-muted);cursor:pointer;text-align:left}
.attach-item:hover{background:var(--bg3);color:var(--text)}
.chat-input{flex:1;font-family:var(--font);font-size:1rem;background:var(--bg2);border:1px solid var(--border2);color:#ddd;padding:.4rem .6rem;resize:none;outline:none;min-height:2.1rem;max-height:8rem;line-height:1.4}
.chat-input:focus{border-color:var(--text-muted)}
.send-btn{font-family:var(--font);font-size:.8rem;padding:.4rem .9rem;background:transparent;border:1px solid #ffaa00;color:#ffaa00;cursor:pointer;white-space:nowrap;flex-shrink:0}
.send-btn:hover{background:rgba(255,170,0,.15)}
.artifact-panel{width:0;border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:width .2s;flex-shrink:0}
.artifact-panel.open{width:360px}
.artifact-header{display:flex;align-items:center;justify-content:space-between;padding:0 .75rem;height:42px;border-bottom:1px solid var(--border);flex-shrink:0}
.artifact-title{font-size:.85rem;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.artifact-close{background:none;border:none;color:var(--text-dim);cursor:pointer;font-family:var(--font);font-size:.9rem}
.artifact-close:hover{color:var(--text)}
.artifact-body{flex:1;overflow:auto;padding:.75rem}
.artifact-code{font-size:.8rem;line-height:1.6;color:#d4d4d4;white-space:pre-wrap;word-break:break-word}
.artifact-canvas-wrap{width:100%;aspect-ratio:1}
.artifact-canvas-wrap canvas{width:100%!important;height:100%!important}
.artifact-meta{font-size:.75rem;color:var(--text-dim);padding:.5rem .75rem;border-top:1px solid var(--border);flex-shrink:0}
.inline-artifact{background:var(--bg2);border-left:2px solid var(--border2);padding:.4rem .75rem;margin:.25rem 0;cursor:pointer;display:flex;align-items:center;gap:.5rem}
.inline-artifact:hover{border-left-color:#ffaa00}
.inline-artifact-type{font-size:.7rem;color:var(--text-dim)}
.inline-artifact-name{font-size:.85rem;color:var(--text)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);width:360px;padding:1.25rem;display:flex;flex-direction:column;gap:1rem}
.modal-title{font-size:.85rem;color:var(--text-dim);letter-spacing:.1em}
.modal-field{display:flex;flex-direction:column;gap:.35rem}
.modal-label{font-size:.75rem;color:var(--text-dim)}
.modal-input,.modal-select,.modal-textarea{font-family:var(--font);font-size:.85rem;background:var(--bg);border:1px solid var(--border2);color:var(--text);padding:.35rem .5rem;outline:none}
.modal-textarea{resize:vertical;min-height:120px}
.modal-input:focus,.modal-textarea:focus{border-color:var(--text-dim)}
.modal-actions{display:flex;justify-content:flex-end;gap:.5rem}
.modal-btn{font-family:var(--font);font-size:.8rem;padding:.35rem .9rem;background:transparent;border:1px solid var(--border2);color:var(--text-dim);cursor:pointer}
.modal-btn:hover{border-color:var(--text-dim);color:var(--text)}
.modal-btn.primary{border-color:var(--text-muted);color:var(--text)}
.modal-btn.save{border-color:#00ff88;color:#00ff88}
.modal-btn.save:hover{background:rgba(0,255,136,.15)}
.modal-btn.cancel:hover{border-color:#ff4444;color:#ff4444;background:rgba(255,68,68,.15)}
.modal-btn.clear:hover{border-color:#ffaa00;color:#ffaa00;background:rgba(255,170,0,.15)}
.profile-modal{background:var(--bg2);border:1px solid var(--border);width:400px;padding:1.25rem;display:flex;flex-direction:column;gap:1rem}
.profile-top{display:flex;gap:1rem;align-items:flex-start}
.profile-sigil{width:80px;height:80px;flex-shrink:0;background:#000;border-radius:3px;overflow:hidden;cursor:pointer;border:2px solid transparent;box-sizing:content-box}
.profile-sigil:hover{border-color:#ffaa00}
.profile-sigil-inner{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.profile-sigil-inner svg{width:100%;height:100%}
.profile-info{flex:1;display:flex;flex-direction:column;gap:.75rem;min-width:0}
.profile-field-label{font-size:.95rem;color:#ddd}
.profile-name-input{font-family:var(--font);font-size:.95rem;background:transparent;border:none;border-bottom:1px solid var(--border2);color:#ddd;padding:.2rem 0;outline:none;flex:1}
.profile-name-input::placeholder{color:var(--text-dim);font-size:.75rem}
.profile-name-input:focus{border-bottom-color:var(--text-muted)}
.profile-ship{font-size:.95rem;color:#ddd;opacity:1}
.profile-point{font-size:.95rem;color:#ddd;opacity:1}
.profile-section-label{font-size:.95rem;color:#ddd;letter-spacing:.1em;margin-bottom:.25rem}
.profile-azimuth-input{font-family:var(--font);font-size:.75rem;background:transparent;border:1px solid var(--border2);color:var(--text);padding:.35rem .5rem;outline:none;width:100%;resize:none;height:calc(4 * 1.4em + .7rem);line-height:1.4;overflow:hidden;box-sizing:border-box}
.profile-azimuth-input::placeholder{color:var(--text-dim);font-size:.75rem}
.profile-azimuth-input:focus{border-color:var(--text-muted)}
.profile-notes-list{font-size:.75rem;color:var(--text-dim);display:flex;flex-direction:column;gap:0}
.profile-note-entry{display:flex;align-items:flex-start;gap:.3rem;padding:.4rem 0;border-bottom:1px solid var(--border)}
.profile-note-entry:last-child{border-bottom:none}
.profile-note-icon{width:3.5rem;height:3.5rem;border-radius:3px;flex-shrink:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;align-items:center;justify-items:center;font-size:.75rem;background:#000;color:#bbb;line-height:1;overflow:hidden}
.profile-note-icon img{width:100%;height:100%;object-fit:cover;border-radius:3px}
.profile-note-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:.1rem}
.profile-note-name{font-size:1rem;color:#ffaa00;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile-note-desc{font-size:.85rem;color:#bbb;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile-note-desc input{font-family:var(--font);font-size:.85rem;background:transparent;border:none;border-bottom:1px solid transparent;color:#bbb;padding:0;outline:none;width:100%}
.profile-note-desc input::placeholder{color:var(--text-dim);font-size:.75rem}
.profile-note-desc input:focus{border-bottom-color:var(--text-muted)}
.profile-note-vis{font-size:.8rem;color:var(--text-dim);line-height:1.3}
.profile-sponsor-chain{font-size:.95rem;color:#ddd;padding:.2rem 0}
.profile-row{display:flex;align-items:baseline;gap:.4rem}
.context-menu{position:fixed;background:#181818;border:1px solid #333;min-width:160px;z-index:1000;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.context-menu-item{padding:.5rem .75rem;color:#ccc;cursor:pointer;display:flex;align-items:center;gap:.5rem;font-size:.9rem}
.context-menu-item:hover{background:#1a1a1a;color:#ffaa00}
.context-menu-item.danger:hover{color:#ff4444}
.context-menu-divider{height:1px;background:#333;margin:.25rem 0}
.context-radio{width:8px;height:8px;border-radius:50%;border:1px solid #555}
.context-radio.selected{background:#ffaa00;border-color:#ffaa00}
.app-picker-list{display:flex;flex-direction:column;gap:.35rem;max-height:300px;overflow-y:auto;padding:.25rem 0}
.app-picker-item{display:flex;align-items:center;gap:.6rem;padding:.5rem .65rem;background:var(--bg2);border:1px solid var(--border);cursor:pointer;font-family:inherit;color:var(--text);font-size:.85rem}
.app-picker-item:hover{border-color:#ffaa00}
.app-picker-icon{font-size:1.1rem;width:24px;text-align:center}
.app-picker-info{display:flex;flex-direction:column;gap:.1rem}
.app-picker-name{font-size:.85rem;color:var(--text)}
.app-picker-desc{font-size:.7rem;color:var(--text-dim)}
.inline-app-artifact{margin:.5rem 0;border:1px solid var(--border);background:var(--bg2);overflow:hidden}
.inline-app-header{display:flex;align-items:center;gap:.5rem;padding:.35rem .65rem;border-bottom:1px solid var(--border);font-size:.8rem;color:var(--text-dim)}
.inline-app-icon{font-size:.9rem}
.inline-app-name{color:var(--text)}
</style>
<script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
</head>
<body>
<div class="app">
  <header class="app-header">
    <span class="logo" onclick="openGrimoireMenu()">GRIMOIRE</span>
    <div class="header-dial" id="dialWrap">
      <span class="dial-label">DIAL</span>
      <div class="dial-box active" onclick="setDial(0)">0</div>
      <div class="dial-box" onclick="setDial(1)">1</div>
      <div class="dial-box" onclick="setDial(2)">2</div>
      <div class="dial-box" onclick="setDial(3)">3</div>
    </div>
    <div class="user-info">
      <span class="ship-name" id="shipDisplay" onclick="openProfileModal()"></span>
    </div>
  </header>
  <div class="app-body">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-resize" id="sidebarResize"></div>
      <div class="sidebar-top">
        <div class="view-toggle">
          <button class="view-toggle-opt active" id="toggleNotes" onclick="switchView('notes')">NOTES</button>
          <button class="view-toggle-opt" id="toggleContact" onclick="switchView('contact')">CONTACTS</button>
        </div>
        <button class="new-btn" id="newBtn" onclick="createNote()">+ NEW</button>
        <button class="pals-btn" id="palsBtn" style="display:none">%PALS</button>
      </div>
      <div class="sidebar-scroll">
        <div class="section-header" onclick="toggleSection('notes')">
          <span class="section-arrow open" id="notesArrow">▶</span>
          <span class="section-title">NOTES</span>
        </div>
        <div class="section-body open" id="notesBody"></div>
        <div class="section-header" onclick="toggleSection('shared')">
          <span class="section-arrow open" id="sharedArrow">▶</span>
          <span class="section-title">SHARED</span>
        </div>
        <div class="section-body open" id="sharedBody"></div>
        <div class="section-header" onclick="toggleSection('ars')">
          <span class="section-arrow open" id="arsArrow">▶</span>
          <span class="section-title">ARS NOTORIA</span>
        </div>
        <div class="section-body open" id="arsBody"></div>
      </div>
      <div class="sidebar-scroll" id="palsList" style="display:none"></div>
    </aside>
    <section class="chat">
      <div class="chat-header">
        <span class="chat-note-name" id="chatNoteName" onclick="openCurrentNoteMenu(event)">%Grimoire</span>
        <button class="share-btn" id="shareBtn" onclick="openSharePrompt()">SHARE</button>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-area">
        <div class="reply-bar" id="replyBar">
          <span class="reply-label" id="replyLabel">↩ replying to</span>
          <button class="reply-close" onclick="cancelReply()">✕</button>
        </div>
        <div class="chat-input-row">
          <textarea class="chat-input" id="chatInput" placeholder="message..." rows="1"
            onkeydown="handleInputKey(event)" oninput="autoResize(this)"></textarea>
          <div class="attach-wrap">
            <button class="attach-btn" onclick="toggleAttachMenu()">+</button>
            <div class="attach-menu" id="attachMenu">
              <button class="attach-item" onclick="openAppPicker()">% Apps</button>
              <button class="attach-item" onclick="pickFile()">⊞ File / Img</button>
              <input type="file" id="quickFileInput" hidden>
              <button class="attach-item" onclick="openArtifactModal('code')">{ } Code</button>
            </div>
          </div>
          <button class="send-btn" onclick="sendMessage()">SEND</button>
        </div>
      </div>
    </section>
    <aside class="artifact-panel" id="artifactPanel">
      <div class="artifact-header">
        <span class="artifact-title" id="artifactPanelTitle"></span>
        <button class="artifact-close" onclick="closeArtifactPanel()">✕</button>
      </div>
      <div class="artifact-body" id="artifactPanelBody"></div>
      <div class="artifact-meta" id="artifactPanelMeta"></div>
    </aside>
  </div>
</div>
<div class="modal-overlay" id="noteModal">
  <div class="modal">
    <span class="modal-title" id="noteModalTitle">NEW NOTE</span>
    <div class="modal-field">
      <label class="modal-label">NAME</label>
      <input class="modal-input" id="noteNameInput" placeholder="note name" autocomplete="off"
        onkeydown="if(event.key==='Enter')submitNote()">
    </div>
    <div class="modal-actions">
      <button class="modal-btn" onclick="closeNoteModal()">CANCEL</button>
      <button class="modal-btn primary" onclick="submitNote()">CREATE</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="artifactModal">
  <div class="modal">
    <span class="modal-title" id="artifactModalTitle">NEW ARTIFACT</span>
    <div class="modal-field">
      <label class="modal-label">NAME</label>
      <input class="modal-input" id="artNameInput" placeholder="artifact-name" autocomplete="off">
    </div>
    <div class="modal-field" id="artContentField">
      <label class="modal-label">CONTENT</label>
      <textarea class="modal-textarea" id="artContentInput" placeholder="content..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="modal-btn" onclick="closeArtifactModal()">CANCEL</button>
      <button class="modal-btn primary" onclick="submitArtifact()">CREATE</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="appPickerModal">
  <div class="modal">
    <span class="modal-title">MY APPS</span>
    <div class="app-picker-list" id="appPickerList"></div>
    <div class="modal-actions">
      <button class="modal-btn" onclick="closeAppPicker()">CANCEL</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="profileModal">
  <div class="profile-modal">
    <div class="profile-top">
      <div class="profile-sigil" id="profileSigilWrap" onclick="promptProfileIcon()"><div class="profile-sigil-inner" id="profileSigil"></div></div>
      <div class="profile-info">
        <div class="profile-row"><span class="profile-field-label">User Name:</span><input class="profile-name-input" id="profileDisplayName" placeholder="set display name..." maxlength="32" autocomplete="off"></div>
        <div class="profile-row"><span class="profile-field-label">Urbit ID:</span><span class="profile-ship" id="profileShip"></span></div>
        <div class="profile-row"><span class="profile-field-label">Point #:</span><span class="profile-point" id="profilePoint"></span></div>
      </div>
    </div>
    <div>
      <div class="profile-row"><span class="profile-field-label">Sponsorship Chain:</span><span class="profile-sponsor-chain" id="profileSponsors"></span></div>
    </div>
    <div>
      <span class="profile-section-label">Offline Azimuth</span>
      <textarea class="profile-azimuth-input" id="profileAzimuth" placeholder="enter offline azimuth..." autocomplete="off"></textarea>
    </div>
    <div>
      <span class="profile-section-label">Shared Notes</span>
      <div class="profile-notes-list" id="profileNotesList">none available</div>
    </div>
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeProfileModal()">CANCEL</button>
      <button class="modal-btn save" onclick="saveProfile()">SAVE</button>
    </div>
  </div>
</div>

const api = {
  ship:null,uid:null,url:null,msgId:0,subs:{},subMeta:{},es:null,reconnecting:false,lastAcked:-1,
  init(ship){this.ship=ship;this.newChannel()},
  newChannel(){this.uid=Date.now().toString(36)+Math.random().toString(36).slice(2,6);this.url=`/~/channel/${this.uid}`;this.msgId=0;this.lastAcked=-1},
  async put(a){try{const r=await fetch(this.url,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(a),credentials:'include'});if(!r.ok){console.error('PUT failed',r.status);return false}return true}catch(e){console.error('PUT error',e);return false}},
  async poke(app,mark,json){return this.put([{id:++this.msgId,action:'poke',ship:this.ship,app,mark,json}])},
  async subscribe(app,path,handler){const id=++this.msgId;this.subs[id]=handler;this.subMeta[id]={app,path,handler};const ok=await this.put([{id,action:'subscribe',ship:this.ship,app,path}]);if(!ok){delete this.subs[id];delete this.subMeta[id];return null}return id},
  async unsubscribe(subId){if(!this.subs[subId])return;this.put([{id:++this.msgId,action:'unsubscribe',subscription:subId}]);delete this.subs[subId];delete this.subMeta[subId]},
  async scry(app,path){const r=await fetch(`/~/scry/${app}${path}.json`,{credentials:'include'});if(!r.ok)throw new Error('scry failed '+r.status);return r.json()},
  open(){
    if(this.es)try{this.es.close()}catch(e){}
    this.es=new EventSource(this.url,{withCredentials:true});
    this.es.onopen=()=>{console.log('[SSE] connected')};
    this.es.onmessage=(e)=>{
      const d=JSON.parse(e.data);
      const evId=parseInt(e.lastEventId);
      if(!isNaN(evId)&&evId>this.lastAcked){
        this.lastAcked=evId;
        this.put([{id:++this.msgId,action:'ack','event-id':evId}]);
      }
      if(d.response==='diff'&&this.subs[d.id])this.subs[d.id](d.json);
    };
    this.es.onerror=(e)=>{
      console.warn('[SSE error]');
      this.es.close();
      if(!this.reconnecting)this.reconnect();
    }
  },
  async reconnect(){
    if(this.reconnecting)return;
    this.reconnecting=true;
    console.log('[SSE] reconnecting with fresh channel...');
    if(this.es)try{this.es.close()}catch(e){}
    await new Promise(r=>setTimeout(r,2000));
    const oldMeta=Object.values(this.subMeta);
    this.subs={};this.subMeta={};
    this.newChannel();
    const batch=[];
    for(const m of oldMeta){
      const id=++this.msgId;
      this.subs[id]=m.handler;
      this.subMeta[id]={app:m.app,path:m.path,handler:m.handler};
      batch.push({id,action:'subscribe',ship:this.ship,app:m.app,path:m.path});
    }
    const ok=batch.length?await this.put(batch):true;
    if(!ok){
      console.error('[SSE] reconnect PUT failed, retrying...');
      this.reconnecting=false;
      setTimeout(()=>this.reconnect(),3000);
      return;
    }
    this.open();
    for(const [id,m] of Object.entries(this.subMeta)){
      if(m.path==='/notes/'+state.currentNoteId)state.currentNoteSub=parseInt(id);
    }
    console.log('[SSE] reconnected, re-subscribed to',oldMeta.length,'paths');
    this.reconnecting=false;
  }
};

(async function loadSigil(){
  try{
    const mod=await import('https://esm.sh/@urbit/sigil-js@2.2.0?bundle');
    sigilFn=mod.default||mod.sigil||mod;
    console.log('[sigil] loaded',typeof sigilFn);
  }catch(e){console.warn('[sigil] failed to load',e)}
})();
function shipType(ship){
  if(!ship||!ship.startsWith('~'))return'comet';
  const bare=ship.slice(1);
  const parts=bare.split('-');
  if(parts.length===1&&bare.length<=3)return'galaxy';
  if(parts.length===1&&bare.length<=6)return'star';
  if(parts.length===2)return'planet';
  if(bare.includes('--'))return'moon';
  return'comet';
}
function shipColor(ship){
  const t=shipType(ship);
  if(t==='galaxy')return'#bb77ff';
  if(t==='star')return'#ffee55';
  if(t==='planet')return'#ffaa00';
  if(t==='moon')return'#00ff88';
  return'#ddd';
}
function getSigilSvg(ship){
  if(sigilCache[ship])return sigilCache[ship];
  if(!ship.startsWith('~'))return null;
  const parts=ship.slice(1).split('-');
  if(parts.length>2)return null;
  if(!sigilFn)return null;
  try{
    const color=shipColor(ship);
    const svg=sigilFn({point:ship,size:44,foreground:color,background:'#000000',space:'none',detail:'default'});
    sigilCache[ship]=svg;
    return svg;
  }catch(e){console.warn('[sigil] error',ship,e);return null}
}
function getLastMessage(noteId){
  let msgs=state.messages[noteId];
  if(!msgs||!msgs.length)return null;
  if(noteId==='cover')msgs=msgs.filter(coverMsgVisible);
  if(!msgs.length)return null;
  return msgs[msgs.length-1];
}
function noteInitials(name){
  const clean=name.replace(/[^a-zA-Z0-9]/g,'');
  const chars=(clean.length>=4?clean.slice(0,4):clean.padEnd(4,' ')).toUpperCase();
  return `<span>${chars[0]}</span><span>${chars[1]}</span><span>${chars[2]}</span><span>${chars[3]}</span>`;
}

async function getShip(){
  try{
    const r=await fetch('/~/host',{credentials:'include'});
    if(r.ok){const t=await r.text();const s=t.trim().replace(/"/g,'');if(s)return s.replace(/^~/,'')}
  }catch(e){}
  for(const c of document.cookie.split(';')){const m=c.trim().match(/^urbauth-(~[\w-]+)=/);if(m)return m[1].slice(1)}
  return location.hostname==='localhost'?'zod':location.hostname.split('.')[0];
}

  return all;

  const chain=[];let cur=byId[msgId];
  while(cur&&cur.replyTo&&byId[cur.replyTo]){cur=byId[cur.replyTo];chain.unshift(cur.id)}

}

}

function openFileFullscreen(artId){const art=state.artifacts[artId];if(!art)return;const lastVer=art.versions[art.versions.length-1];if(!lastVer)return;let meta={};try{meta=JSON.parse(lastVer.content)}catch(e){return}const overlay=document.createElement('div');overlay.id='file-fullscreen';overlay.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.92);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center';const bar=document.createElement('div');bar.style.cssText='position:absolute;top:0;right:0;padding:.75rem 1rem;display:flex;gap:.5rem;z-index:1';bar.innerHTML=`<a href="${escAttr(meta.dataUrl)}" download="${escAttr(meta.fileName||art.name)}" style="font-family:var(--font);font-size:.75rem;padding:.25rem .6rem;border:1px solid #555;color:#aaa;text-decoration:none;cursor:pointer">DOWNLOAD</a><button onclick="this.closest('#file-fullscreen').remove()" style="font-family:var(--font);font-size:.75rem;padding:.25rem .6rem;border:1px solid #555;color:#aaa;background:none;cursor:pointer">CLOSE</button>`;overlay.appendChild(bar);const body=document.createElement('div');body.style.cssText='max-width:95%;max-height:90%;overflow:auto';if(meta.mimeType&&meta.mimeType.startsWith('image/')){body.innerHTML=`<img src="${escAttr(meta.dataUrl)}" style="max-width:100%;max-height:90vh">`}else if(meta.mimeType==='application/pdf'){body.innerHTML=`<iframe src="${escAttr(meta.dataUrl)}" style="width:90vw;height:85vh;border:none;background:#fff"></iframe>`}else if(meta.mimeType&&(meta.mimeType.startsWith('text/')||meta.mimeType==='application/json')){fetch(meta.dataUrl).then(r=>r.text()).then(t=>{body.innerHTML=`<pre style="color:#ddd;font-size:.85rem;white-space:pre-wrap;padding:1rem">${escHtml(t)}</pre>`})}else{body.innerHTML=`<div style="color:#aaa;font-size:1rem;text-align:center"><div style="font-size:2rem;margin-bottom:.5rem">📄</div>${escHtml(meta.fileName||art.name)}</div>`}overlay.appendChild(body);overlay.addEventListener('click',function(e){if(e.target===overlay)overlay.remove()});document.body.appendChild(overlay)}
function openArtifactModal(type){document.getElementById('attachMenu').classList.remove('open');state.currentArtifactType=type;document.getElementById('artifactModalTitle').textContent=type==='code'?'NEW CODE':'NEW FILE / IMG';document.getElementById('artNameInput').value='';document.getElementById('artContentInput').value='';document.getElementById('artContentField').style.display='';document.getElementById('artFileField').style.display='none';document.getElementById('artifactModal').classList.add('open');setTimeout(()=>document.getElementById('artNameInput').focus(),50)}

function openArtifactPanel(id){const art=state.artifacts[id];if(!art)return;document.getElementById('artifactPanel').classList.add('open');document.getElementById('artifactPanelTitle').textContent=art.name;const lastVer=art.versions[art.versions.length-1];const content=lastVer?lastVer.content:'';const body=document.getElementById('artifactPanelBody');if(art.type==='file'){let meta={};try{meta=JSON.parse(content)}catch(e){}if(meta.dataUrl&&meta.mimeType&&meta.mimeType.startsWith('image/')){body.innerHTML=`<img src="${escAttr(meta.dataUrl)}" alt="${escAttr(art.name)}" style="max-width:100%">`}else if(meta.dataUrl){body.innerHTML=`<a href="${escAttr(meta.dataUrl)}" download="${escAttr(meta.fileName||art.name)}" style="color:var(--amber)">${escHtml(meta.fileName||art.name)}</a>`}else{body.innerHTML=`<div class="artifact-file-wrap">${escHtml(content)}</div>`}}else if(art.type==='app'){let meta={};try{meta=JSON.parse(content)}catch(e){}const iframeId='app-iframe-'+id;body.innerHTML=`<iframe id="${iframeId}" src="/apps/noltbook/pkg/${meta.packageId||'canvas'}" sandbox="allow-scripts" style="width:100%;height:600px;border:none;background:#181818"></iframe>`;initHostBridge(iframeId,id,meta)}else{body.innerHTML=`<pre class="artifact-code">${escHtml(content)}</pre>`}document.getElementById('artifactPanelMeta').textContent=`v${art.versions.length} · ${art.creator} · ${new Date(lastVer?lastVer.timestamp:Date.now()).toLocaleDateString()}`}
function closeArtifactPanel(){document.getElementById('artifactPanel').classList.remove('open');state.activeAppBridge=null}
function initHostBridge(iframeId,artifactId,meta){
  const iframe=document.getElementById(iframeId);
  if(!iframe)return;
  if(state.activeAppBridge&&state.activeAppBridge.listener){window.removeEventListener('message',state.activeAppBridge.listener)}
  function handler(event){
    const data=event.data;
    if(!data||typeof data!=='object')return;
    if(data.type==='nb:init'&&data.source){
      const art=state.artifacts[artifactId];
      const lastVer=art&&art.versions[art.versions.length-1];
      let appState={};
      if(lastVer){try{appState=JSON.parse(lastVer.content).state||{}}catch(e){}}
      iframe.contentWindow.postMessage({source:'noltbook-host',type:'nb:init',payload:{hostShip:'~'+api.ship,state:appState}},'*');
    }
    if(data.type==='nb:dispatch'&&data.payload){
      const art=state.artifacts[artifactId];
      const lastVer=art&&art.versions[art.versions.length-1];
      let oldContent={};
      if(lastVer){try{oldContent=JSON.parse(lastVer.content)}catch(e){}}
      oldContent.state={json:data.payload.payload.json};
      api.poke('noltbook','noltbook-action',{action:'file-save',data:{id:artifactId,data:JSON.stringify(oldContent)}});
    }
    if(data.type==='nb:resize'&&data.payload){
      const isInline=iframe.id&&iframe.id.startsWith('app-iframe-');
      if(!isInline)iframe.style.height=data.payload.height+'px';
    }
  }
  window.addEventListener('message',handler);
  state.activeAppBridge={iframeId,artifactId,meta,listener:handler};
}

function shipToPoint(ship){
  if(obLib&&obLib.patp2dec)try{return Number(obLib.patp2dec(ship))}catch(e){}
  return -1;
}
function resizeImageToBlob(file,maxSize,cb){
  const img=new Image();
  img.onload=function(){
    const c=document.createElement('canvas');
    const scale=Math.min(maxSize/img.width,maxSize/img.height,1);
    c.width=Math.round(img.width*scale);
    c.height=Math.round(img.height*scale);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    c.toBlob(function(blob){cb(blob)},'image/jpeg',0.7);
  };
  img.src=URL.createObjectURL(file);
}

  menu.innerHTML=`
    <div style="font-size:.85rem;color:var(--text)">Profile Picture</div>
    <input type="text" id="profileIconUrl" value="${escAttr(currentUrl)}" placeholder="Paste image URL (https://...)..." style="background:var(--bg1);color:var(--text);border:1px solid var(--border);padding:.4rem;font-size:.8rem">
    <div style="font-size:.75rem;color:var(--dim)">— or —</div>
    <label style="background:var(--bg1);border:1px solid var(--border);padding:.4rem;text-align:center;cursor:pointer;font-size:.8rem;color:var(--text)">Upload Image<input type="file" accept="image/*" id="profileIconFile" style="display:none"></label>
    <div id="profileIconPreview" style="display:none;text-align:center"></div>
    <div class="modal-actions">
      <button class="modal-btn cancel" id="profileIconCancel">CANCEL</button>
      <button class="modal-btn clear" id="profileIconClear">CLEAR</button>
      <button class="modal-btn save" id="profileIconSave">SAVE</button>
    </div>`;
  overlay.addEventListener('click',function(e){if(e.target===overlay){overlay.remove();menu.remove()}});
  document.body.appendChild(overlay);
  document.body.appendChild(menu);
  const fileInput=menu.querySelector('#profileIconFile');
  const urlInput=menu.querySelector('#profileIconUrl');
  const preview=menu.querySelector('#profileIconPreview');
  fileInput.addEventListener('change',function(){
    const file=this.files[0];if(!file)return;
    resizeImageToBlob(file,128,function(blob){
      pendingBlob=blob;
      urlInput.value='(file selected)';

    const p=state.profiles['~'+api.ship]||{};
    api.poke('noltbook','noltbook-action',{action:'update-profile',data:{displayName:p.displayName||null,avatar:null,walletAddress:p.walletAddress||null,azimuthAddress:p.azimuthAddress||null}});
    ownAvatarBlobUrl=null;
    updateSidebarSigil();
    overlay.remove();menu.remove();
  });
  menu.querySelector('#profileIconSave').addEventListener('click',async function(){
    const p=state.profiles['~'+api.ship]||{};
    if(pendingBlob){
      const resp=await fetch('/apps/noltbook/upload-avatar',{method:'POST',body:pendingBlob,credentials:'include'});
      if(resp.ok){
        ownAvatarBlobUrl=URL.createObjectURL(pendingBlob);
        api.poke('noltbook','noltbook-action',{action:'update-profile',data:{displayName:p.displayName||null,avatar:{type:'urbit',url:''},walletAddress:p.walletAddress||null,azimuthAddress:p.azimuthAddress||null}});
        updateSidebarSigil();
      }
    }else{
      const val=urlInput.value.trim();
      if(val&&!val.startsWith('data:')){
        api.poke('noltbook','noltbook-action',{action:'update-profile',data:{displayName:p.displayName||null,avatar:{type:'external',url:val},walletAddress:p.walletAddress||null,azimuthAddress:p.azimuthAddress||null}});
      }
    }
    overlay.remove();menu.remove();
  });
}
async function viewProfile(ship){
  const isMe=ship==='~'+api.ship;
  if(isMe){openProfileModal();return}
  const p=state.profiles[ship]||{};
  const sc=shipColor(ship);
  const overlay=document.createElement('div');
  overlay.className='modal-overlay open';
  const modal=document.createElement('div');
  modal.className='profile-modal';
  const viewUrl=resolveAvatarUrl(ship);
  const avatarContent=viewUrl
    ?'<img src="'+escAttr(viewUrl)+'" style="width:100%;height:100%;object-fit:cover" onerror="this.style.display=\'none\'">'+(function(){const svg=getSigilSvg(ship);return svg||'<span style="color:'+sc+';font-size:1.5rem">'+ship.slice(1,3)+'</span>'})()
    :(function(){const svg=getSigilSvg(ship);return svg||'<span style="color:'+sc+';font-size:1.5rem">'+ship.slice(1,3)+'</span>'})();
  const dn=p.displayName||ship;
  const pt=shipToPoint(ship);
  const allNotes=Object.values(state.notes);
  const userNotes=allNotes.filter(n=>(n.users&&(Array.isArray(n.users)?n.users.includes(ship):false))||n.creator===ship);
  const pubNotes=userNotes.filter(n=>n.visibility==='public').sort((a,b)=>a.name.localeCompare(b.name));
  const privNotes=userNotes.filter(n=>n.visibility==='private').sort((a,b)=>a.name.localeCompare(b.name));
  const sharedNotes=[...pubNotes,...privNotes];
  const notesHtml=sharedNotes.length===0?'<span style="color:var(--dim)">loading...</span>'
    :sharedNotes.map(n=>{
      const ic=n.iconUrl?'<img src="'+escAttr(n.iconUrl)+'">':noteInitials(n.name);
      const vis=n.visibility==='public'?'public':'private';
      return '<div class="profile-note-entry"><div class="profile-note-icon">'+ic+'</div><div class="profile-note-text"><span class="profile-note-name">'+escHtml(n.name)+'</span><span class="profile-note-vis">'+vis+'</span></div></div>';
    }).join('');
  modal.innerHTML=`
    <div class="profile-top">
      <div class="profile-sigil"><div class="profile-sigil-inner">${avatarContent}</div></div>
      <div class="profile-info">
        <div class="profile-row"><span class="profile-field-label">User Name:</span><span style="color:${sc}">${escHtml(dn)}</span></div>
        <div class="profile-row"><span class="profile-field-label">Urbit ID:</span><span style="color:${sc}">${escHtml(ship)}</span></div>
        <div class="profile-row"><span class="profile-field-label">Point #:</span><span style="color:${sc}">${pt>=0?pt:''}</span></div>
      </div>
    </div>
    <div class="profile-row"><span class="profile-field-label">Sponsors:</span><span id="viewProfileSponsors" style="color:var(--dim)">loading...</span></div>
    <div class="contact-tags" style="padding:.25rem 0">
      <span class="contact-tag pal-slot" id="viewProfilePal" onclick="viewProfileTogglePal('${escAttr(ship)}')"></span>
      <span class="contact-tag block-slot" id="viewProfileBlock" onclick="viewProfileToggleBlock('${escAttr(ship)}')"></span>
      <span class="contact-tag" style="border-color:#ff4444;color:#ff4444;margin-left:.35rem" onclick="viewProfileDeleteContact('${escAttr(ship)}')">DELETE CONTACT</span>
    </div>
    ${p.azimuthAddress?'<div><span class="profile-field-label">Offline Azimuth:</span> <span style="color:var(--text)">'+escHtml(p.azimuthAddress)+'</span></div>':''}
    <div>
      <span class="profile-section-label">Notes</span>
      <div class="profile-notes-list" id="viewProfileNotes">${notesHtml}</div>
    </div>
    <div class="modal-actions">
      <button class="modal-btn cancel" id="viewProfileClose">CLOSE</button>
    </div>`;
  overlay.appendChild(modal);
  overlay.addEventListener('click',function(e){if(e.target===overlay)overlay.remove()});
  document.body.appendChild(overlay);
  overlay.querySelector('#viewProfileClose').addEventListener('click',function(){overlay.remove()});
  updateViewProfileTags(ship);
  try{
    const res=await api.scry('noltbook','/sponsors/'+ship);
    let chain=(res['sponsor-chain']||[]).reverse();
    if(chain.length===0&&shipType(ship)==='galaxy')chain=[ship];
    const el=overlay.querySelector('#viewProfileSponsors');
    if(el)el.innerHTML=chain.map(s=>'<span style="color:'+shipColor(s)+'">'+s+'</span>').join('&nbsp;&nbsp;')||'none';
  }catch(e){console.warn('[sponsors]',e);const el=overlay.querySelector('#viewProfileSponsors');if(el)el.textContent='unavailable'}
  // fetch remote notes
  api.poke('noltbook','noltbook-action',{action:'request-remote-notes',data:{ship}});
}
async function openProfileModal(){
  const ship='~'+api.ship;
  const p=state.profiles[ship];
  const sc=shipColor(ship);
  document.getElementById('profileDisplayName').value=(p&&p.displayName)||'';
  document.getElementById('profileDisplayName').style.color=sc;
  document.getElementById('profileAzimuth').value=(p&&p.azimuthAddress)||'';
  document.getElementById('profileShip').textContent=ship;
  document.getElementById('profileShip').style.color=sc;
  const pt=shipToPoint(ship);
  document.getElementById('profilePoint').textContent=pt>=0?''+pt:'';
  document.getElementById('profilePoint').style.color=sc;
  renderAvatar(ship,document.getElementById('profileSigil'));
  const notesListEl=document.getElementById('profileNotesList');
  const allNotes=Object.values(state.notes);
  const pubNotes=allNotes.filter(n=>n.visibility==='public').sort((a,b)=>a.name.localeCompare(b.name));
  const privNotes=allNotes.filter(n=>n.visibility==='private').sort((a,b)=>a.name.localeCompare(b.name));
  const sharedNotes=[...pubNotes,...privNotes];
  if(sharedNotes.length===0){notesListEl.textContent='none available'}
  else{notesListEl.innerHTML=sharedNotes.map(n=>{const ic=n.iconUrl?`<img src="${escAttr(n.iconUrl)}">`:(noteInitials(n.name));const vis=n.visibility==='public'?'public':'private';const desc=n.noteDescription||'';return `<div class="profile-note-entry"><div class="profile-note-icon">${ic}</div><div class="profile-note-text"><span class="profile-note-name">${escHtml(n.name)}</span><div class="profile-note-desc"><input type="text" value="${escAttr(desc)}" placeholder="add a description..." data-note-id="${n.id}" onchange="updateNoteDescription(this)" maxlength="120"></div><span class="profile-note-vis">${vis}</span></div></div>`}).join('')}
  const sponsorEl=document.getElementById('profileSponsors');
  sponsorEl.textContent='loading...';
  document.getElementById('profileModal').classList.add('open');
  try{
    const res=await api.scry('noltbook','/sponsors');
    let chain=(res['sponsor-chain']||[]).reverse();
    if(chain.length===0&&shipType(ship)==='galaxy')chain=[ship];
    sponsorEl.innerHTML=chain.map(s=>`<span style="color:${shipColor(s)}">${s}</span>`).join('&nbsp;&nbsp;')||'none';
  }catch(e){console.warn('[sponsors]',e);sponsorEl.textContent='unavailable'}
}

function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function escAttr(s){return String(s).replace(/'/g,'&#39;').replace(/"/g,'&quot;')}
document.addEventListener('click',(e)=>{if(!e.target.closest('.attach-wrap'))document.getElementById('attachMenu').classList.remove('open')});
(function initSidebarResize(){
  const sidebar=document.getElementById('sidebar');
  const handle=document.getElementById('sidebarResize');
  let dragging=false,startX=0,startW=0;
  handle.addEventListener('mousedown',(e)=>{e.preventDefault();dragging=true;startX=e.clientX;startW=sidebar.offsetWidth;document.body.style.cursor='col-resize';document.body.style.userSelect='none'});
  document.addEventListener('mousemove',(e)=>{if(!dragging)return;const w=Math.min(500,Math.max(150,startW+(e.clientX-startX)));sidebar.style.width=w+'px'});
  document.addEventListener('mouseup',()=>{if(dragging){dragging=false;document.body.style.cursor='';document.body.style.userSelect=''}});
})();
function updateViewProfileTags(ship){
  const status=state.palStatus[ship]||'none';
  const isBlocked=status==='blocked';
  const palInfo=isBlocked?{cls:'contact-tag pal-slot',label:'PALS'}:(function(){const p=palStatusLabel(status);return{cls:p.cls+' pal-slot',label:p.label}})();
  const blockInfo=isBlocked?{cls:'contact-tag blocked block-slot',label:'BLOCKED'}:{cls:'contact-tag block-slot',label:'BLOCK'};
  const pe=document.getElementById('viewProfilePal');const be=document.getElementById('viewProfileBlock');
  if(pe){pe.className=palInfo.cls;pe.textContent=palInfo.label}
  if(be){be.className=blockInfo.cls;be.textContent=blockInfo.label}
}
function viewProfileTogglePal(ship){
  const status=state.palStatus[ship]||'none';
  if(status==='mutual'||status==='requesting')api.poke('noltbook','noltbook-action',{action:'remove-pal',data:{ship}});
  else api.poke('noltbook','noltbook-action',{action:'add-pal',data:{ship}});
  setTimeout(()=>updateViewProfileTags(ship),100);
}
function viewProfileToggleBlock(ship){
  const be=document.getElementById('viewProfileBlock');
  be.classList.toggle('blocked');
  be.textContent=be.classList.contains('blocked')?'BLOCKED':'BLOCK';
}

function toggleMsgActions(el,force,event){
  const msg=el.closest('.msg');if(!msg)return;
  if(event){
    const t=event.target;
    if(t.tagName==='A'||t.tagName==='BUTTON'||t.tagName==='INPUT'||t.tagName==='IFRAME'||t.closest('.msg-actions'))return;
  }
  const isOpen=msg.classList.contains('show-actions');
  document.querySelectorAll('.msg.show-actions').forEach(m=>m.classList.remove('show-actions'));
  if(force===false){return}
  if(!isOpen)msg.classList.add('show-actions');
}
document.addEventListener('click',(e)=>{
  const m=e.target.closest('.msg');
  if(!m){document.querySelectorAll('.msg.show-actions').forEach(x=>x.classList.remove('show-actions'));return}
  const t=e.target;
  if(t.closest('.msg-actions')||t.closest('.msg-avatar')||t.tagName==='A'||t.tagName==='BUTTON'||t.tagName==='INPUT'||t.closest('iframe')||t.closest('.msg-author'))return;
  const isOpen=m.classList.contains('show-actions');
  document.querySelectorAll('.msg.show-actions').forEach(x=>x.classList.remove('show-actions'));
  if(!isOpen)m.classList.add('show-actions');
});
